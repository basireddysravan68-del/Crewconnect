{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <div class="mb-4">
        <h2>Reports</h2>
        <p class="text-muted">
            CrewConnect employee and payroll reports
        </p>
    </div>

    <div class="row">

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Employees</h6>
                    <h2>{{ employees_count }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Payroll Records</h6>
                    <h2>{{ payroll_count }}</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h6>Total Payslips</h6>
                    <h2>{{ payslip_count }}</h2>
                </div>
            </div>
        </div>

    </div>

</div>

{% endblock %}
