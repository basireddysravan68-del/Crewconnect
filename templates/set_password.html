<!DOCTYPE html>
<html>
<head>
    <title>Set Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .password-box {
            width: 400px;
            background: white;
            padding: 35px;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        .password-box h2 {
            text-align: center;
            margin-bottom: 10px;
            color: #212529;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            height: 45px;
            padding: 10px 12px;

            border: 1px solid #ced4da;
            border-radius: 6px;

            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15);
        }

        .error {
            background: #f8d7da;
            color: #842029;

            padding: 10px;
            border-radius: 6px;

            margin-bottom: 20px;
            text-align: center;
        }

        .set-password-btn {
            width: 100%;
            height: 45px;

            border: none;
            border-radius: 6px;

            background: #0d6efd;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .set-password-btn:hover {
            background: #0b5ed7;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #0d6efd;
            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="password-box">

        <h2>Create Your Password</h2>

        <p class="subtitle">
            Set a password for your CrewConnect account
        </p>

        {% if error %}
            <div class="error">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>

            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm password"
                    required
                >

            </div>

            <button
                type="submit"
                class="set-password-btn"
            >
                Create Password
            </button>

        </form>

        <div class="login-link">
            Already have a password?
            <a href="{% url 'login' %}">
                Login
            </a>
        </div>

    </div>

</body>
</html>
