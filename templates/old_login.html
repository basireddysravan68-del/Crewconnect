<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>

<body>

    <h2>HR Login</h2>

    <form method="POST">

        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username">

        <br><br>

        <label>Password</label>
        <input type="password" name="password">

        <br><br>

        <button type="submit">Login</button>

    </form>

    {% if error %}
        <p>{{ error }}</p>
    {% endif %}

</body>

</html>
